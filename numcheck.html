<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Parash | Number Checker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <meta
      name="description"
      content="Check the SIM Card of your phone number by just pasting the number."
    />
    <link
      rel="shortcut icon"
      href="assets/images/icon.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/body.css" />
    <link rel="stylesheet" href="styles/number.css" />
  </head>

  <body class="body-container">
    <!-- Header Section -->
    <header id="header" class="header">
      <nav class="navbar">
        <div class="logo">
          <a href="#" onclick="scrollToSection('home')">
            <img class="logo-img" src="assets/images/icon.svg" alt="Logo" />
          </a>
        </div>

        <div class="nav" id="nav">
          <ul class="link-container">
            <li class="links">
              <a href="#home" title="Home" id="homenav link">Home</a>
            </li>
            <li class="links">
              <a href="#about" title="About" id="aboutnav link">About</a>
            </li>
            <li class="links resume">
              <a
                href="assets/cv/CV.pdf"
                id="link"
                target="_blank"
                title="See Resume"
                >Resume</a
              >
            </li>
            <li class="links">
              <a href="#contact" title="Contact" id="contactnav link">
                Contact
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="checker-container">
      <label for="number-input">Enter your phone number:</label>
      <div class="input">
        <input
          type="number"
          autocomplete="off"
          id="number-input"
          placeholder="Enter the phone number"
        />
        <button type="submit" id="paste">
          Paste
          <i class="fa-solid fa-paste"></i>
        </button>
      </div>
      <button type="submit" id="check-button">Check</button>
      <div class="loader"></div>
      <p id="result"></p>
    </main>

    <!-- Javascript -->
    <script src="javascript/numberchecker.js"></script>
  </body>
</html>
